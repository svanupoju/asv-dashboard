<div class="settings">
  <div class="card p-4">
    <h1 class="mb-4 card-title">Settings</h1>
    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control w-75" id="username" placeholder="Enter username">
        </div>
        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control w-75" id="password" placeholder="Enter password">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Permissions</label>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-dashboard">
            <label class="form-check-label" for="perm-dashboard">Dashboard Access</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-salary">
            <label class="form-check-label" for="perm-salary">Salary Income</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-support">
            <label class="form-check-label" for="perm-support">Technical Support</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-interview">
            <label class="form-check-label" for="perm-interview">Interview Assistance</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-instructors">
            <label class="form-check-label" for="perm-instructors">Instructors</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="perm-settings">
            <label class="form-check-label" for="perm-settings">Settings</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
